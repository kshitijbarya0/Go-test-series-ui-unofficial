<html lang="en">
<head>

<title>GATE Test Series Tracker</title>
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --border:#e5e7ef;
    --border-active:#f3b5b5;
    --ink:#1f2430;
    --muted:#8a90a3;
    --accent:#4f63e0;
    --green:#1fa971;
    --green-bg:#e9f9f1;
    --amber:#e6a930;
    --amber-bg:#fff6e2;
    --pink:#e0517a;
    --pink-bg:#fdeaf0;
    --purple:#7c5ce0;
    --purple-bg:#f1edfd;
    --radius:14px;
    --font-display: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: var(--font-display);
    background:var(--bg);
    color:var(--ink);
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .legend{
    display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--border);border-radius:999px;
    padding:8px 20px;margin-bottom:18px;font-size:12px;color:var(--muted);
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .header-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .header-row h1{font-size:19px;margin:0;letter-spacing:-0.01em;}
  .overall{
    font-size:12px;color:var(--muted);font-weight:600;
    background:var(--card);border:1px solid var(--border);
    padding:6px 12px;border-radius:999px;
  }
  .overall b{color:var(--accent);}

  .subject{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .subject.open{border-color:var(--border-active); box-shadow:0 2px 14px rgba(224,81,122,.06);}
  .subject-head{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;cursor:pointer;user-select:none;
  }
  .icon{
    width:30px;height:30px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;flex-shrink:0;
  }
  .subject-name{font-size:13.5px;font-weight:700;flex:1;}
  .subject-progress-mini{
    font-size:11px;color:var(--muted);font-weight:600;min-width:44px;text-align:right;
  }
  .count-badge{
    font-size:11px;font-weight:700;color:var(--muted);
    background:#f1f2f7;border-radius:999px;padding:3px 10px;
  }
  .chevron{
    width:16px;height:16px;transition:transform .15s ease;color:var(--muted);flex-shrink:0;
  }
  .subject.open .chevron{transform:rotate(180deg);}

  .bar-track{height:4px;background:#eef0f6;margin:0 16px;border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:99px;transition:width .25s ease;}

  .test-table{padding:6px 10px 14px;}
  .test-row{
    display:grid;
    grid-template-columns:22px 1fr auto auto;
    gap:12px;
    align-items:center;
    padding:9px 8px;
    border-radius:9px;
  }
  .test-row:hover{background:#fafbfd;}
  .test-row.done{opacity:.55;}

  .cb{
    width:18px;height:18px;border-radius:6px;border:1.5px solid #cfd3e2;
    cursor:pointer;flex-shrink:0;position:relative;background:#fff;
    transition:all .12s ease;
  }
  .cb.checked{background:var(--green);border-color:var(--green);}
  .cb.checked::after{
    content:'';position:absolute;left:5px;top:1px;width:5px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);
  }

  .test-info{min-width:0;}
  .test-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .test-name{
    font-size:13px;font-weight:600;outline:none;
  }
  .test-row.done .test-name{text-decoration:line-through;text-decoration-color:#b8bcc9;}
  .tag{
    font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.02em;
  }
  .tag.topic{background:var(--purple-bg);color:var(--purple);}
  .tag.subject{background:#e6f1fb;color:#2f7fd1;}
  .tag.mixed{background:var(--amber-bg);color:#b3821f;}
  .tag.mock{background:var(--pink-bg);color:var(--pink);}
  .topic-name{
    font-size:11.5px;color:var(--muted);margin-top:2px;outline:none;
  }

  .status-pill{
    font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;
    white-space:nowrap;justify-self:end;
  }
  .status-pill.pending{background:var(--green-bg);color:var(--green);}
  .status-pill.completed{background:#eef0f6;color:#8a90a3;}
  .status-pill.wait{background:var(--amber-bg);color:#b3821f;}

  .start-btn{
    font-size:11px;font-weight:700;color:#fff;background:var(--accent);
    border:none;border-radius:8px;padding:6px 12px;cursor:pointer;
    text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
    justify-self:end;
  }
  .start-btn:hover{background:#3d50d1;}
  .start-btn.done{background:#eef0f6;color:#8a90a3;}
  .start-btn.wait{background:var(--amber-bg);color:#b3821f;cursor:default;}

  .add-row{
    display:flex;align-items:center;gap:8px;padding:8px 8px 4px;
  }
  .add-btn{
    font-size:11.5px;font-weight:700;color:var(--accent);background:#eef0fd;
    border:none;border-radius:8px;padding:6px 12px;cursor:pointer;
  }
  .add-btn:hover{background:#e1e5fb;}

  .footer-note{
    text-align:center;font-size:11.5px;color:var(--muted);margin-top:20px;line-height:1.6;
  }
  .reset-link{color:var(--pink);cursor:pointer;font-weight:600;text-decoration:underline;}

  .subject-body{display:none;}
  .subject.open .subject-body{display:block;}

  @media (max-width:480px){
    .test-table{padding:4px 4px 10px;}
    .test-row{grid-template-columns:20px 1fr auto;gap:8px;padding:8px 4px;}
    .status-pill{font-size:9.5px;padding:3px 8px;}
  }
</style>
</head>

function buildTests(subj){
  return subj.tests;
}

let state = {}; // { "subjIdx-testIdx": true/false }
let names = {}; // { "subjIdx-testIdx-name" or "-topic": "custom text" }
let openIdx = 0;

const STORE_KEY = 'gate-tracker-progress-v1';
const NAMES_KEY = 'gate-tracker-names-v1';

async function loadState(){
  try{
    const r = await window.storage.get(STORE_KEY);
    if(r && r.value) state = JSON.parse(r.value);
  }catch(e){ state = {}; }
  try{
    const r2 = await window.storage.get(NAMES_KEY);
    if(r2 && r2.value) names = JSON.parse(r2.value);
  }catch(e){ names = {}; }
  render();
}

async function saveState(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
async function saveNames(){
  try{ await window.storage.set(NAMES_KEY, JSON.stringify(names)); }catch(e){}
}

function tagLabel(tag){
  return {topic:'Topic', subject:'Subject', mixed:'Mixed', mock:'Mock'}[tag] || 'Topic';
}

function render(){
  const container = document.getElementById('subjects');
  container.innerHTML = '';
  let totalDone = 0, totalAll = 0;

  DATA.forEach((subj, si)=>{
    const tests = buildTests(subj);
    totalAll += tests.length;
    let doneCount = 0;
    tests.forEach((t,ti)=>{ if(state[si+'-'+ti]) doneCount++; });
    totalDone += doneCount;

    const color = COLORS[si % COLORS.length];
    const isOpen = si === openIdx;

    const card = document.createElement('div');
    card.className = 'subject' + (isOpen ? ' open':'');

    const pct = tests.length ? Math.round((doneCount/tests.length)*100) : 0;

    card.innerHTML = `
      <div class="subject-head" data-si="${si}">
        <div class="icon" style="background:${color.bg};color:${color.fg}">${ICONS[si % ICONS.length]}</div>
        <div class="subject-name">${subj.name}</div>
        <div class="subject-progress-mini">${doneCount}/${tests.length}</div>
        <div class="count-badge">${tests.length} Tests</div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="subject-body">
        <div class="test-table" data-si="${si}"></div>
      </div>
    `;
    container.appendChild(card);

    const table = card.querySelector('.test-table');
    tests.forEach((t, ti)=>{
      const key = si+'-'+ti;
      const checked = !!state[key];
      const nameOverride = names[key+'-name'];
      const topicOverride = names[key+'-topic'];
      const row = document.createElement('div');
      row.className = 'test-row' + (checked ? ' done':'');

      let statusHtml, startHtml;
      if(t.wait){
        statusHtml = `<div class="status-pill wait">Coming Soon</div>`;
        startHtml = `<a class="start-btn wait" href="${t.link}" target="_blank" rel="noopener">Notify</a>`;
      } else if(checked){
        statusHtml = `<div class="status-pill completed">Completed</div>`;
        startHtml = `<a class="start-btn done" href="${t.link}" target="_blank" rel="noopener">Retake ▶</a>`;
      } else {
        statusHtml = `<div class="status-pill pending">Ready to Attempt</div>`;
        startHtml = `<a class="start-btn" href="${t.link}" target="_blank" rel="noopener">Start ▶</a>`;
      }

      row.innerHTML = `
        <div class="cb ${checked?'checked':''}" data-key="${key}"></div>
        <div class="test-info">
          <div class="test-name-row">
            <span class="test-name" contenteditable="true" spellcheck="false" data-key="${key}" data-field="name">${nameOverride ?? t.name}</span>
            <span class="tag ${t.tag}">${tagLabel(t.tag)}</span>
          </div>
          <div class="topic-name" contenteditable="true" spellcheck="false" data-key="${key}" data-field="topic">${topicOverride ?? t.topic}</div>
        </div>
        ${statusHtml}
        ${startHtml}
      `;
      table.appendChild(row);
    });
  });

  document.getElementById('overallLabel').innerHTML = `<b>${totalDone}</b> / ${totalAll} done`;

  // listeners
  container.querySelectorAll('.subject-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      const si = parseInt(h.dataset.si);
      openIdx = (openIdx === si) ? -1 : si;
      render();
    });
  });
  container.querySelectorAll('.cb').forEach(cb=>{
    cb.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = cb.dataset.key;
      state[key] = !state[key];
      saveState();
      render();
    });
  });
  container.querySelectorAll('[contenteditable]').forEach(el=>{
    el.addEventListener('click', e=>e.stopPropagation());
    el.addEventListener('blur', ()=>{
      const key = el.dataset.key, field = el.dataset.field;
      names[key+'-'+field] = el.textContent.trim();
      saveNames();
    });
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); el.blur(); }
    });
  });
}

document.getElementById('resetLink').addEventListener('click', async ()=>{
  if(confirm('Clear all checked tests? This cannot be undone.')){
    state = {};
    await saveState();
    render();
  }
});

loadState();
</script>
